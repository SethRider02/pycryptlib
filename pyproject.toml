[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycryptlib"]

[project]
name = "cgacryptpy"
version = "0.2.0"
description = "This library contains a multitude of cryptography functions that can be used in python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seth Bacher", email = "sethrider02@gmail.com" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/SethRider02/pycryptlib"